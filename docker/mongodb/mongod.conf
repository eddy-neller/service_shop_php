# Configuration mongod du service shop — versionnee.
# https://www.mongodb.com/docs/manual/reference/configuration-options/
#
# Elle vit dans un fichier plutot que dans le `command:` de docker-compose pour une
# raison precise : `replication.replSetName` n'est pas un reglage de confort, c'est le
# prerequis des transactions multi-documents. En le posant ici, sous revue de code et
# accompagne de son commentaire, on rend beaucoup plus difficile sa disparition
# accidentelle lors d'un nettoyage de docker-compose.

storage:
  dbPath: /data/db

net:
  port: 27017
  # Le serveur n'est joignable que depuis le reseau du projet compose : aucun port
  # n'est publie vers l'hote (voir docker-compose.override.yaml).
  bindIpAll: true

replication:
  # Replica set mono-noeud. Ce n'est pas de la haute disponibilite — c'est la seule
  # facon d'obtenir des transactions multi-documents : un mongod standalone les
  # refuse. Sans lui, `MongoTransactional` degenere en une suite d'ecritures
  # independantes, sans la moindre erreur au demarrage.
  #
  # L'initialisation (`rs.initiate`) reste dans le healthcheck du service : elle ne
  # peut avoir lieu qu'une fois le serveur en ecoute.
  replSetName: rs0

security:
  # Necessaire a l'authentification interne du replica set lorsque `--auth` est
  # active par l'image officielle via MONGO_INITDB_ROOT_USERNAME/PASSWORD.
  keyFile: /etc/mongodb-keyfile
