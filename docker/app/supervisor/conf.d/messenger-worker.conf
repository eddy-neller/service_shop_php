; Worker de l'outbox des Domain Events (transport `mongodb-outbox://domain_events`,
; cf. config/packages/messenger.yaml).
;
; Il n'y a pas de worker `async` : ce service n'a pas de broker, et aucun message applicatif
; n'est route ailleurs que vers l'outbox. Le fichier est copie dans l'image — le modifier
; impose de reconstruire et recreer le conteneur `app`, pas seulement de le redemarrer.
[program:messenger-consume-domain-events]
command=php /var/www/bin/console messenger:consume domain_events --time-limit=3600 --memory-limit=256M --limit=100 --failure-limit=5
user=www-data
; Deux processus : la reservation d'un message est un findOneAndUpdate atomique, donc deux
; workers ne peuvent pas se voir attribuer la meme ligne. Le ledger couvre le reste — la
; redelivrance apres `redeliver_timeout`, qui elle peut bien viser un message deja traite.
numprocs=2
autostart=true
autorestart=true
; Au redemarrage, `depends_on: service_healthy` n'est pas rejoue : le worker peut demarrer
; avant que le replica set MongoDB ait elu son primaire. On tolere les echecs le temps que
; la base reponde.
startsecs=5
startretries=20
process_name=%(program_name)s_%(process_num)02d
; Laisse le message en cours se terminer avant de tuer le processus : c'est ce qui evite
; qu'un deploiement produise une redelivrance inutile.
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
