; Transport AMQP : e-mails et messages applicatifs asynchrones.
[program:messenger-consume-async]
command=php /var/www/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --limit=200 --failure-limit=5
user=www-data
numprocs=1
autostart=true
autorestart=true
; Au redémarrage, `depends_on: service_healthy` n'est pas rejoué : le worker peut
; démarrer avant RabbitMQ. On tolère les échecs le temps que le broker réponde.
startsecs=5
startretries=20
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Outbox transactionnel des Domain Events (transport Doctrine, cf. config/packages/messenger.yaml).
[program:messenger-consume-domain-events]
command=php /var/www/bin/console messenger:consume domain_events --time-limit=3600 --memory-limit=256M --limit=100 --failure-limit=5
user=www-data
numprocs=2
autostart=true
autorestart=true
; Idem côté Postgres : la connexion est coupée à l'arrêt de la base.
startsecs=5
startretries=20
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
