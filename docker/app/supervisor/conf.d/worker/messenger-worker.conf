; Workers Messenger (cf. config/packages/messenger.yaml). Le fichier est copie dans l'image —
; le modifier impose de reconstruire et recreer le conteneur `app`, pas seulement de le redemarrer.

; Transport AMQP : messages asynchrones sur le RabbitMQ interne a ce service.
[program:messenger-consume-async]
command=php /var/www/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --limit=200 --failure-limit=5
user=www-data
numprocs=1
autostart=true
autorestart=true
; Au redemarrage, `depends_on: service_healthy` n'est pas rejoue : le worker peut
; demarrer avant RabbitMQ. On tolere les echecs le temps que le broker reponde.
startsecs=5
startretries=20
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Outbox des Domain Events (transport `mongodb-outbox://domain_events`).
[program:messenger-consume-domain-events]
command=php /var/www/bin/console messenger:consume domain_events --time-limit=3600 --memory-limit=256M --limit=100 --failure-limit=5
user=www-data
; Deux processus : la reservation d'un message est un findOneAndUpdate atomique, donc deux
; workers ne peuvent pas se voir attribuer la meme ligne. Le ledger couvre le reste — la
; redelivrance apres `redeliver_timeout`, qui elle peut bien viser un message deja traite.
numprocs=2
autostart=true
autorestart=true
; Au redemarrage, `depends_on: service_healthy` n'est pas rejoue : le worker peut demarrer
; avant que le replica set MongoDB ait elu son primaire. On tolere les echecs le temps que
; la base reponde.
startsecs=5
startretries=20
process_name=%(program_name)s_%(process_num)02d
; Laisse le message en cours se terminer avant de tuer le processus : c'est ce qui evite
; qu'un deploiement produise une redelivrance inutile.
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Evenements d'integration recus de `service_identity` (file SQS `shop-user-events`).
[program:messenger-consume-user-events]
command=php /var/www/bin/console messenger:consume user_events --time-limit=3600 --memory-limit=128M --limit=200 --failure-limit=5
user=www-data
; Un seul processus : la file est en mode standard, donc deux workers pourraient recevoir le meme
; message avant son acquittement. L'inbox et la convergence des cas d'usage rendent ce doublon
; inoffensif, mais rien n'est a gagner a le provoquer — le volume est celui des creations de compte.
numprocs=1
autostart=true
autorestart=true
; La brique `aws_local` est une **autre stack**, qui peut legitimement etre eteinte. La commande
; n'en meurt plus : `BusOutageTolerantTransport` la fait attendre (1 s a 30 s) et elle reprend seule
; au retour du bus. Ce budget ne sert plus qu'aux echecs de demarrage reels — file inexistante,
; droits refuses, configuration fausse —, qui doivent finir FATAL et etre vus.
startsecs=5
startretries=50
process_name=%(program_name)s_%(process_num)02d
; Laisse le message en cours se terminer : un deploiement ne doit pas provoquer de redelivrance.
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
