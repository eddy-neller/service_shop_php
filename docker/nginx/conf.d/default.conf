server {
    root /var/www/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # `fastcgi_pass app:9000` en dur resout le nom UNE SEULE FOIS, au demarrage
        # de nginx : avec plusieurs instances d'`app`, nginx n'en verrait qu'une, a
        # vie — mesure en conditions reelles, 30 requetes toutes servies par la meme.
        # Passer par une variable force une resolution par requete, donc une
        # repartition reelle et la prise en compte des instances qui apparaissent.
        #
        # 127.0.0.11 est le resolveur DNS embarque de Docker. `resolver local=on`,
        # qui lirait /etc/resolv.conf et serait portable tel quel en Kubernetes,
        # n'est pas supporte par cette build (nginx 1.31.3) : elle interprete
        # `local=on` comme un nom d'hote et refuse de demarrer. Verifie par
        # `nginx -t` — a re-tester avant de porter ce fichier ailleurs.
        resolver 127.0.0.11 valid=10s;
        set $upstream_host app;
        fastcgi_pass $upstream_host:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Tout autre .php est inaccessible.
    location ~ \.php$ {
        return 404;
    }

    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }
}
