# RabbitMQ configuration for E.N Shop API

# Allow the 'guest' user to connect from any IP (use dedicated users in production)
loopback_users = none

# Ports
listeners.tcp.default = 5672
management.tcp.port = 15672

# Default vhost and credentials
#
# Un vhost par service, jamais le `/` par defaut : le nom evite tout encodage dans la DSN
# (`/` s'ecrirait `%2f`), et la meme variable alimente aussi RABBITMQ_DEFAULT_VHOST, qui la
# prend telle quelle. Ce reglage n'agit qu'a la PREMIERE initialisation du volume : sur un
# volume existant, creer le vhost a la main (`rabbitmqctl add_vhost` + `set_permissions`).
default_vhost = en_shop_shop

# Pas de `default_user` / `default_pass` ici : `docker-compose.yaml` passe
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS, et l'environnement l'emporte sur ce
# fichier. Les declarer ne configurait rien et versionnait un mot de passe en clair.
# L'identifiant vit dans `.env` (RABBITMQ_USER / RABBITMQ_PASSWORD), lui seul fait foi.

# Default permissions
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5
