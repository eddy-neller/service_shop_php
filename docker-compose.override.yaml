# Surcharges de DEVELOPPEMENT LOCAL uniquement.
#
# Compose charge ce fichier automatiquement ; une production ne le deploie pas. Tout
# ce qui est ici doit donc etre inutile au fonctionnement du service : confort de
# debogage, acces direct depuis l'hote, code monte a chaud.
#
# C'est ce qui remplace les anciens « Commenter la ligne suivante en production ».

services:
###> doctrine/mongodb-odm-bundle ###
  mongodb:
    ports:
      - "${MONGODB_EXPOSED_PORT:-20912}:27017"
###< doctrine/mongodb-odm-bundle ###

  app:
    # Composer et les outils reseau ne vivent que dans cette etape.
    build:
      target: dev
    volumes:
      # Code monte depuis l'hote : l'image embarque deja le code (`COPY . .`), ce
      # montage ne sert qu'a voir ses modifications sans reconstruire.
      - ./:/var/www:rw

  worker:
    build:
      target: dev
    volumes:
      - ./:/var/www:rw
    # Le worker est le **seul** service de cette stack a rejoindre le bus : c'est lui qui consomme
    # la file SQS des evenements d'integration. Ni `app`, ni `nginx`, ni les bases n'ont de raison
    # d'y acceder, et les y attacher donnerait a LocalStack un chemin vers eux.
    #
    # `default` est liste explicitement : declarer `networks:` sur un service **remplace** son
    # rattachement implicite, et l'oublier couperait le worker de MongoDB et de RabbitMQ.
    #
    # En developpement seulement, comme le reste de ce fichier : en production, le bus est AWS, que
    # le worker joint par son egress normal — il n'y a pas de reseau Docker a rejoindre.
    networks:
      default: {}
      bus: {}

  nginx:
    ports:
      - "${NGINX_EXPOSED_PORT:-20910}:80"
    volumes:
      - ./:/var/www:rw
      - ./var/log/nginx:/var/log/nginx:cached
    networks:
      default: {}
      edge:
        aliases:
          - service-shop

  redis:
    ports:
      - "${REDIS_EXPOSED_PORT:-20913}:6379"

###> symfony/messenger with rabbitmq ###
  rabbitmq:
    ports:
      - "${RABBITMQ_EXPOSED_PORT:-20918}:5672" # AMQP protocol
      - "${RABBITMQ_MANAGEMENT_EXPOSED_PORT:-20919}:15672" # Management UI
###< symfony/messenger with rabbitmq ###

# Seul `nginx` rejoint le reseau de la passerelle en developpement. MongoDB, RabbitMQ, Redis et Varnish restent sur le
# reseau par defaut de la stack : c'est ce qui garantit *par la topologie* qu'aucun
# autre service ne peut joindre cette base, et inversement (cf. AGENTS.md).
#
# Reseau `external` : il doit exister avant `docker compose up`, sinon la stack
# refuse de monter. C'est `make up` qui le cree (idempotent), pour que le service
# continue de demarrer seul sans dependre de la passerelle.
networks:
  edge:
    external: true
    name: en_shop_php_edge

  # Reseau du bus inter-services, distinct de `edge` : `edge` porte le trafic HTTP nord-sud (Kong
  # vers nginx), `bus` relie les workers a l'API AWS. Les confondre donnerait a Kong un chemin vers
  # les workers. Cree par `make network`, comme `edge`, pour que la stack demarre sans dependre de
  # la brique `aws_local`.
  bus:
    external: true
    name: en_shop_php_bus
