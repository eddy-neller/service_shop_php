security:
    # Configuration de validation JWT.
    # Indispensable : sans cette hierarchie, un ROLE_ADMIN present dans le token
    # n'impliquerait pas ROLE_USER cote shop.
    role_hierarchy:
        ROLE_MODERATEUR: [ROLE_USER]
        ROLE_ADMIN: [ROLE_MODERATEUR]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    # Aucun user provider adosse a une base : l'utilisateur est reconstruit
    # depuis les seuls claims du token.
    providers:
        jwt_users:
            lexik_jwt:
                class: App\Security\JwtAuthenticatedUser

    firewalls:
        main:
            stateless: true
            entry_point: jwt
            provider: jwt_users
            jwt: ~

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
